# Run separately: docker compose -f compose.demo.yml up --build -d
name: stroysnab-local-demo
services:
  demo-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: stroysnab_demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo-local-only
    # PostgreSQL 18 stores versioned data below /var/lib/postgresql.
    volumes:
      - demo_postgres18:/var/lib/postgresql
    networks: [demo_internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d stroysnab_demo"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  demo-app:
    build:
      context: .
      dockerfile: Dockerfile.demo
    init: true
    depends_on:
      demo-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DEMO_MODE: isolated-local
      DATABASE_URL: postgresql://demo:demo-local-only@demo-db:5432/stroysnab_demo
      APP_URL: http://localhost:3000
      SITE_URL: http://localhost:3000
      SESSION_SECRET: isolated-local-demo-session-secret-not-for-production
      ORDER_GUEST_LINK_SECRET: isolated-local-demo-guest-secret-not-for-production
      STORAGE_DRIVER: local
      STORAGE_DIR: /app/.data/storage
      AUTH_PASSWORD_LOGIN_DISABLED: "false"
      STAFF_EMAIL_OTP_REQUIRED: "false"
      AUTH_SMS_PROVIDER: disabled
      AUTH_EMAIL_PROVIDER: disabled
      NOTIFICATIONS_SMS_ENABLED: "false"
      NOTIFICATIONS_EMAIL_ENABLED: "false"
      AI_QUOTATION_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - demo_uploads:/app/.data/storage
    networks: [demo_internal]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      start_period: 120s
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
networks:
  demo_internal:
    internal: true
volumes:
  demo_postgres18:
  demo_uploads:
