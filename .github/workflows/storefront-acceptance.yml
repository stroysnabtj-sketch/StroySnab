name: Storefront acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: storefront-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: 'true'
      PGLITE_DATA_DIR: .data/ci-unit-db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:noenv
      - run: npm run test:acceptance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-browser-report
          path: |
            .data/acceptance-report
            .data/acceptance-results
          retention-days: 14
